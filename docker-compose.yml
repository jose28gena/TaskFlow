services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Obligatoria: mínimo 32 caracteres. Ej.: JWT_KEY=$(openssl rand -base64 48)
      Jwt__Key: ${JWT_KEY:?Define la variable JWT_KEY antes de levantar el servicio}
    volumes:
      - taskflow-data:/data

volumes:
  taskflow-data:
